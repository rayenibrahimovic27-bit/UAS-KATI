<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAS KATI 2026 - Form Pemesanan</title>
    <style>
        /* --- RESET & GLOBAL STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- HEADER BANNER --- */
        header {
            background-color: #1a365d;
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .banner-img {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 8px;
            border: 2px solid #2b6cb0;
            object-fit: cover;
        }

        .brand-title {
            color: #ffffff;
            font-size: 1.8rem;
            margin-top: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- NAVIGATION BAR --- */
        nav {
            background-color: #2b6cb0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nav-link {
            color: #ffffff;
            font-weight: bold;
            padding: 14px 24px;
            transition: background 0.3s, color 0.3s;
            font-size: 0.95rem;
        }

        .nav-link:hover, .nav-link.active {
            background-color: #1a365d;
        }

        /* --- FORM CONTAINER --- */
        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .form-title {
            text-align: center;
            color: #1a365d;
            margin-bottom: 20px;
            font-size: 1.6rem;
        }

        .title-divider {
            border: none;
            height: 3px;
            background-color: #2b6cb0;
            margin: 10px auto 25px auto;
            width: 80px;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #1a365d;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #333;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #2b6cb0;
        }

        .btn-submit {
            width: 100%;
            background-color: #2b6cb0;
            color: #ffffff;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #1a365d;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #1a365d;
            color: #ffffff;
            text-align: center;
            padding: 20px 15px;
            margin-top: 60px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- HEADER BANNER -->
    <header>
        <img src="https://github.com/rayenibrahimovic27-bit/kati-/blob/main/showroom.jpg?raw=true" alt="Banner Showroom" class="banner-img">
        <h1 class="brand-title">SHOWROOM MOBIL BROT</h1>
    </header>

    <!-- NAVIGATION BAR -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-link">Katalog Produk</a>
            <a href="detail terbaru.html" class="nav-link">Detail Unggulan</a>
            <a href="transaksi terbaru.html" class="nav-link active">Pemesanan</a>
            <a href="invoice terbaru.html" class="nav-link active">Invoice</a>
			<a href="tentang terbaru.html" class="nav-link">Tentang Kami</a>
            <a href="kontak terbaru.html" class="nav-link">Kontak Kami</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        <div class="form-card">
            <h2 class="form-title">Formulir Pemesanan Mobil</h2>
            <div class="title-divider"></div>

            <form id="orderForm">
                <div class="form-group">
                    <label for="nama">Nama Lengkap Pembeli</label>
                    <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
                </div>

                <div class="form-group">
                    <label for="telepon">Nomor WhatsApp / HP</label>
                    <input type="tel" id="telepon" required placeholder="0812xxxxxxxx">
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>

                <div class="form-group">
                    <label for="mobil">Pilihan Kendaraan</label>
                    <select id="mobil" required>
                        <option value="">-- Pilih Mobil --</option>
                        <option value="Honda Civic RS 1.5L Turbo|600000000">Honda Civic RS 1.5L Turbo - Rp 600.000.000</option>
                        <option value="Toyota Fortuner GR Sport|580000000">Toyota Fortuner GR Sport - Rp 580.000.000</option>
                        <option value="Mitsubishi Pajero Sport|570000000">Mitsubishi Pajero Sport - Rp 570.000.000</option>
                        <option value="Hyundai Ioniq 5 EV|750000000">Hyundai Ioniq 5 EV - Rp 750.000.000</option>
                    	<option value="Toyota Avanza|235000000">Toyota Avanza - Rp 235.000.000</option>
                    	<option value="Suzuki Ertiga|240000000">Suzuki Ertiga - Rp 240.000.000</option>
                    	<option value="Wuiling Air Ev|220000000">Wuling Air Ev - Rp 220.000.000</option>
                    	<option value="Daihatsu Rocky|205000000">Daihatsu Rocky - Rp 205.000.000</option>
                    	<option value="Mazda CX-5|599000000">Mazda CX-5 - Rp 599.000.000</option>
					</select>
                </div>

                <div class="form-group">
                    <label for="pembayaran">Metode Pembayaran</label>
                    <select id="pembayaran" required>
                        <option value="Cash / Tunai">Cash / Tunai</option>
                        <option value="Kredit Leasing (DP 20%)">Kredit Leasing (DP 20%)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="catatan">Catatan Tambahan (Opsional)</label>
                    <textarea id="catatan" rows="3" placeholder="Warna kendaraan, paket purna jual, dll."></textarea>
                </div>

                <button type="submit" class="btn-submit">Pesan Sekarang & Proses Invoice &rarr;</button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2025 Showroom Mobil BROT.</p>
    </footer>

    <!-- SCRIPT PROCESS -->
    <script>
       document.getElementById('orderForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Mencegah submit default HTML

    // 1. Ambil data input
    const nama = document.getElementById('nama').value;
    const telepon = document.getElementById('telepon').value;
    const email = document.getElementById('email').value;
    const mobilSelect = document.getElementById('mobil');
    const pembayaran = document.getElementById('pembayaran').value;
    const catatan = document.getElementById('catatan').value || '-';

    const mobilVal = mobilSelect.value.split('|');
    const namaMobil = mobilVal[0];
    const hargaMobil = parseInt(mobilVal[1]) || 0;

    const noInvoice = 'INV/BROT/' + Math.floor(100000 + Math.random() * 900000);
    const today = new Date();
    const tanggal = today.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

    // 2. Simpan Data
    const invoiceData = {
        noInvoice: noInvoice,
        tanggal: tanggal,
        nama: nama,
        telepon: telepon,
        email: email,
        namaMobil: namaMobil,
        hargaMobil: hargaMobil,
        pembayaran: pembayaran,
        catatan: catatan
    };

    localStorage.setItem('pesananBROT', JSON.stringify(invoiceData));

    // 3. Pindah Halaman dengan Jalur Relatif Tegas
    window.location.assign('./invoice terbaru.html');
});
    </script>
</body>
</html>
